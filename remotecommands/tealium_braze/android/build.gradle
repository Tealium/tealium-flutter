group 'com.tealium.flutter.remotecommands.tealium_braze'
version '3.1.0'

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'

android {
    // androidx.core 1.15.0, pulled in by the Braze SDK, requires compileSdk 35 or higher (enforced by checkDebugAarMetadata on AGP 9).
    compileSdk 35

    namespace = 'com.tealium.flutter.remotecommands.tealium_braze'
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    defaultConfig {
        minSdkVersion 25
    }
}

dependencies {
    compileOnly rootProject.findProject(":tealium")

    implementation 'com.tealium.remotecommands:braze:3.3.0'
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_1_8
    }
}