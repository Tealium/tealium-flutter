group 'com.tealium.flutter.remotecommands.tealium_braze'
version '2.0.0'

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'

android {
    compileSdk 34

    if (project.android.hasProperty("namespace")) {
        namespace = 'com.tealium.flutter.remotecommands.tealium_braze'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        minSdkVersion 25
    }
}

dependencies {
    compileOnly rootProject.findProject(":tealium")

    implementation 'com.tealium.remotecommands:braze:3.3.0'
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_1_8
    }
}