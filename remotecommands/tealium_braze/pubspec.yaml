name: tealium_braze
description: A Flutter plugin for using Tealium's Braze Remote Command with the Tealium Flutter Plugin.
version: 3.0.0
homepage: https://docs.tealium.com/platforms/flutter/

environment:
  sdk: ^3.11.0
  flutter: ">=3.41.0"

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.0.2
  tealium: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.tealium.flutter.remotecommands.tealium_braze
        pluginClass: TealiumBrazePlugin
      ios:
        pluginClass: TealiumBrazePlugin
