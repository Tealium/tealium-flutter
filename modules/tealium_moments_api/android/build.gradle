group = "com.tealium.flutter.moments_api.tealium_moments_api"
version = "3.1.0"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: "com.android.library"

android {
    namespace = "com.tealium.flutter.moments_api.tealium_moments_api"

    compileSdk = 34

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        minSdk = 21
    }

    dependencies {
        compileOnly rootProject.findProject(":tealium")

        implementation 'com.tealium:kotlin-core:1.9.2'
        implementation 'com.tealium:kotlin-momentsapi:1.0.6'
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_1_8
    }
}
